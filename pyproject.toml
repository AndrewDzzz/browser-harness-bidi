[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-harness-bidi"
version = "0.2.0"
description = "browser-harness-bidi: a bidi-first browser harness for agent-written Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=15.0.1",
  "pillow>=10",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
browser-harness = "browser_harness.run:main"
browser-harness-bidi = "browser_harness_bidi.run:main"
bidi-harness = "browser_harness_bidi.run:main"
bidi-firefox = "browser_harness_bidi.firefox:main"
bidi-chrome = "browser_harness_bidi.chrome:main"
bidi-ruyi-firefox = "browser_harness_bidi.ruyi_firefox:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
